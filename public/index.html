<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duett-Karaoke</title>
<script>
  // Weiterleitungen: Spotify-Login kommt auf "/" zurück, QR-Code-Links alter Version
  (function () {
    var q = location.search, p = new URLSearchParams(q);
    if (p.get('code') || p.get('error')) location.replace('/display.html' + q);
    else if (p.get('room')) location.replace('/phone.html?room=' + encodeURIComponent(p.get('room')));
  })();
</script>
<style>
  :root { --bg:#0d0d13; --card:#171722; --card2:#222233; --fg:#f2f2f5; --dim:#8a8a9c; --g:#1db954; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .box { width:min(560px, 100%); }
  h1 { font-size:32px; text-align:center; margin:0 0 6px; } p.sub { text-align:center; color:var(--dim); margin:0 0 22px; }
  .card { background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px; }
  .card h2 { margin:0 0 6px; font-size:18px; } .card p { margin:0 0 14px; color:var(--dim); font-size:14px; line-height:1.4; }
  a.btn, button, input { display:block; width:100%; text-align:center; text-decoration:none; font:inherit; font-size:17px; border:0; border-radius:12px; padding:15px; color:var(--fg); background:var(--card2); }
  a.primary, button.primary { background:var(--g); color:#04140a; font-weight:700; }
  input { margin-bottom:10px; text-align:center; text-transform:uppercase; letter-spacing:.2em; }
  .rec { outline:2px solid var(--g); }
</style>
</head>
<body>
<div class="box">
  <h1>🎤 Duett-Karaoke</h1>
  <p class="sub">Mac = Bildschirm und Musik · Handys = Mikrofone</p>

  <div class="card" id="cDisplay">
    <h2>Hauptbildschirm (Mac / TV)</h2>
    <p>Raum erstellen, Spotify verbinden, Songs wählen. Die Handys treten per QR-Code bei.</p>
    <a class="btn primary" href="/display.html">Raum erstellen</a>
  </div>

  <div class="card" id="cPhone">
    <h2>Mikro-Handy</h2>
    <p>Raum-Code vom Bildschirm eingeben (oder einfach den QR-Code scannen).</p>
    <input id="code" placeholder="CODE" maxlength="4" autocapitalize="characters" autocomplete="off">
    <button id="go">Weiter</button>
  </div>
</div>
<script>
  document.getElementById('go').onclick = function () {
    var c = document.getElementById('code').value.trim().toUpperCase();
    if (c.length === 4) location.href = '/phone.html?room=' + encodeURIComponent(c);
  };
  // Auf dem Handy das Mikro-Feld, am Mac den Bildschirm hervorheben
  var phone = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  document.getElementById(phone ? 'cPhone' : 'cDisplay').classList.add('rec');
</script>
</body>
</html>
