<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d13">
<title>Duett-Karaoke – Mikro</title>
<style>
  :root { --bg:#0d0d13; --card:#171722; --card2:#222233; --fg:#f2f2f5; --dim:#8a8a9c; --m:#4da3ff; --f:#ff6fb5; --b:#ffd54a; --g:#1db954; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }
  button, input, select { font:inherit; font-size:16px; border:0; border-radius:12px; padding:13px; color:var(--fg); background:var(--card2); width:100%; }
  button:active { opacity:.7; } button:disabled { opacity:.4; }
  button.primary { background:var(--g); color:#04140a; font-weight:700; } button.ghost { background:transparent; border:1px solid var(--card2); color:var(--dim); }
  input { margin-bottom:10px; }
  .hint { color:var(--dim); font-size:13px; margin:6px 0; line-height:1.4; }
  .hidden { display:none !important; } .screen { display:none; height:100%; } .screen.on { display:block; }
  .row { display:flex; gap:8px; align-items:center; } .row > * { min-width:0; }
  #conn { position:fixed; top:0; left:0; right:0; z-index:60; background:#b3261e; text-align:center; padding:6px; font-size:14px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(90px + env(safe-area-inset-bottom)); z-index:70; background:#333; padding:12px 14px; border-radius:12px; text-align:center; display:none; }

  /* Beitreten */
  #s-join { padding:20px 16px; overflow:auto; } #s-join .inner { max-width:480px; margin:0 auto; }
  #s-join h1 { font-size:24px; margin:10px 0 6px; }

  /* Hauptansicht */
  #app { height:100%; display:flex; flex-direction:column; background-color:#1b1a33; background-image:linear-gradient(180deg, rgba(13,13,19,0) 0%, #0d0d13 78%); transition:background-color .9s; }
  #bar { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 6px; }
  #bar .meta { flex:1; min-width:0; } #barTitle { font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #barSub { color:rgba(255,255,255,.6); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #btnGear { width:44px; height:44px; padding:0; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; flex:0 0 44px; }
  #btnGear svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #board { display:flex; gap:8px; padding:4px 16px 8px; overflow-x:auto; }
  .chip { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:20px; background:rgba(0,0,0,.35); border:2px solid transparent; font-size:14px; white-space:nowrap; }
  .chip.r-m { border-color:var(--m); } .chip.r-f { border-color:var(--f); } .chip.me { background:rgba(255,255,255,.14); } .chip b { font-size:17px; font-variant-numeric:tabular-nums; }
  #stage { position:relative; flex:1; min-height:0; }
  #lyrScroll { position:absolute; inset:0; overflow-y:auto; padding:34% 22px 55%; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
               -webkit-mask-image:linear-gradient(transparent 0, #000 9%, #000 90%, transparent 100%); mask-image:linear-gradient(transparent 0, #000 9%, #000 90%, transparent 100%); }
  .ly { position:relative; font-size:clamp(26px, 8.2vw, 40px); font-weight:800; line-height:1.16; padding:9px 0; color:rgba(255,255,255,.36); transition:color .25s; --c:var(--b); --p:0; letter-spacing:-.01em; }
  .ly.r-m { --c:var(--m); } .ly.r-f { --c:var(--f); } .ly.r-b { --c:var(--b); }
  .ly.past { color:rgba(255,255,255,.2); }
  .ly.mine::before { content:''; position:absolute; left:-13px; top:12px; bottom:12px; width:4px; border-radius:2px; background:var(--c); opacity:.9; }
  .ly.active { background:linear-gradient(90deg, var(--c) calc(var(--p) * 1%), rgba(255,255,255,.55) calc(var(--p) * 1%)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ly .tag { display:block; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--c); opacity:0; height:0; overflow:hidden; transition:opacity .25s; }
  .ly.active .tag { opacity:.95; height:auto; margin-bottom:2px; -webkit-text-fill-color:var(--c); }
  #msg, #results { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 28px; font-size:22px; font-weight:700; line-height:1.3; overflow:auto; }
  #msg small { display:block; margin-top:10px; font-size:15px; font-weight:400; color:rgba(255,255,255,.6); }
  #results { justify-content:flex-start; padding-top:24px; } #results h2 { margin:0 0 14px; }
  .res { width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:14px; background:rgba(0,0,0,.35); margin-bottom:8px; border-left:6px solid #666; font-size:20px; text-align:left; } .res.r-m { border-color:var(--m); } .res.r-f { border-color:var(--f); } .res.first { outline:3px solid var(--b); } .res small { display:block; color:var(--dim); font-size:13px; font-weight:400; } .res.me { background:rgba(255,255,255,.14); }

  /* Mikro-Leiste unten */
  #micBar { display:flex; align-items:center; gap:12px; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(13,13,19,.92); border-top:1px solid rgba(255,255,255,.08); min-height:64px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#555; flex:0 0 14px; } .dot.on { background:var(--g); box-shadow:0 0 10px var(--g); }
  #note { font-size:26px; font-weight:800; min-width:64px; font-variant-numeric:tabular-nums; } #note.off { color:var(--dim); }
  .meter { flex:1; height:10px; background:var(--card2); border-radius:5px; overflow:hidden; } .meter i { display:block; height:100%; width:0; background:var(--b); }
  #roleMini { font-size:13px; font-weight:700; padding:4px 10px; border-radius:14px; background:var(--card2); white-space:nowrap; } #roleMini.m { background:var(--m); color:#001; } #roleMini.f { background:var(--f); color:#100; }

  /* Einstellungen (aufklappbar) */
  #sheet { position:fixed; inset:0; z-index:50; }
  #sheet .backdrop { position:absolute; inset:0; background:rgba(0,0,0,.55); }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .22s ease-out; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; } .phead b { font-size:20px; } .phead button { width:40px; height:40px; padding:0; border-radius:50%; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
  .card > label { display:block; color:var(--dim); font-size:12px; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; }
  .badge { display:inline-block; padding:5px 12px; border-radius:20px; background:var(--card2); font-size:14px; font-weight:600; } .badge.m { background:var(--m); color:#001; } .badge.f { background:var(--f); color:#100; }
  .pitchBox { display:flex; align-items:center; gap:14px; margin-top:12px; }
  .tuner { flex:1; } .tuner .bar { position:relative; height:10px; background:var(--card2); border-radius:5px; } .tuner .mid { position:absolute; left:50%; top:-3px; width:2px; height:16px; background:var(--dim); } .tuner .pt { position:absolute; top:-3px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--g); left:50%; transition:left .06s; }
  .range { display:flex; align-items:center; gap:10px; margin:10px 0 4px; } .range span { min-width:70px; font-size:14px; color:var(--dim); } .range input { margin:0; padding:0; }
  #sNote { font-size:34px; font-weight:800; min-width:90px; }
</style>
</head>
<body>
<div id="conn" class="hidden">Verbindung getrennt – verbinde neu …</div>
<div id="toast"></div>

<!-- Beitreten -->
<section id="s-join" class="screen on">
  <div class="inner">
    <h1>🎤 Mikro-Handy</h1>
    <p class="hint" style="margin-bottom:16px">Dieses Handy wird ein Mikrofon für das Duett-Karaoke.</p>
    <div id="codeRow"><input id="joinCode" placeholder="Raum-Code (4 Buchstaben)" maxlength="4" autocapitalize="characters" autocomplete="off"></div>
    <p id="roomLabel" class="hint hidden"></p>
    <input id="joinName" placeholder="Dein Name" maxlength="20" autocomplete="off">
    <button class="primary" id="btnJoin">Beitreten</button>
  </div>
</section>

<!-- Verbunden: Liedtext im Vordergrund -->
<section id="s-main" class="screen">
  <div id="app">
    <header id="bar">
      <div class="meta"><div id="barTitle"></div><div id="barSub"></div></div>
      <button id="btnGear" aria-label="Einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div id="board" class="hidden"></div>
    <div id="stage">
      <div id="lyrScroll" class="hidden"><div id="lyrList"></div></div>
      <div id="msg"></div>
      <div id="results" class="hidden"></div>
    </div>
    <footer id="micBar">
      <button class="primary" id="btnMicBanner">🎙️ Mikro aktivieren</button>
      <div id="micOn" class="row hidden" style="flex:1">
        <span class="dot" id="micDot"></span><div id="note" class="off">–</div><div class="meter"><i id="meterFill"></i></div><span id="roleMini"></span>
      </div>
    </footer>
  </div>

  <!-- Einstellungen -->
  <div id="sheet" class="hidden">
    <div class="backdrop" id="sheetBack"></div>
    <div class="panel">
      <div class="phead"><b>Einstellungen</b><button id="btnSheetClose" aria-label="Schließen">✕</button></div>
      <div class="card">
        <label>Du</label>
        <div class="row"><b id="myNameH" style="flex:1;font-size:20px"></b><span class="badge" id="roleBadge">noch nicht zugeordnet</span></div>
        <div class="hint" id="roomInfo"></div>
        <button class="ghost" id="btnRename" style="margin-top:6px">Namen ändern</button>
      </div>
      <div class="card">
        <label>Mikrofon</label>
        <select id="micSel" style="margin-bottom:10px"><option value="">Standard-Mikrofon</option></select>
        <button class="primary" id="btnMic">🎙️ Mikro aktivieren</button>
        <div class="hint" id="micState">Mikro ist aus.</div>
        <div class="pitchBox">
          <div id="sNote">–</div>
          <div class="tuner"><div class="bar"><div class="mid"></div><div class="pt" id="tunerPt"></div></div><div class="hint" id="centTxt" style="margin-top:8px">Deine Tonhöhe</div></div>
        </div>
        <div class="range"><span>Empfindlich</span><input type="range" id="sens" min="1.3" max="6" step="0.1"><span id="sensVal" style="min-width:40px;text-align:right"></span></div>
        <div class="row" style="margin-top:8px"><button id="btnCalib">Kalibrieren</button><button id="btnCalibAuto">Auto</button></div>
        <div class="hint">Kalibrieren: 2,5 s nicht singen, während die Musik läuft. Handy nah an den Mund halten.</div>
      </div>
      <button class="ghost" id="btnLeave">Raum verlassen</button>
    </div>
  </div>
</section>

<script src="/common.js"></script>
<script src="/pitch.js"></script>
<script>
'use strict';
const { $, $$, esc, store, toast, Net } = KA;

const S = {
  code: null, id: null, name: store.get('name', ''), role: '', phase: 'lobby',
  players: [], track: null, lines: [], gOffset: 0,
  base: { pos: 0, ts: 0, playing: false }, lastRaw: -2, lastActive: -2, userScrollUntil: 0
};
let joinCode = '';
const TINT = { m: '#1b3a66', f: '#5a2146', b: '#4a3f14', x: '#1b1a33' };

function show(name) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name)); }

/* ====================================================================
   Netz
   ==================================================================== */
function handle(m) {
  switch (m.type) {
    case 'joined': return enter(m);
    case 'players': S.players = m.players; syncMe(); renderBoard(); if (S.phase === 'results') renderResults(); return;
    case 'assigned': S.role = m.role; S.name = m.name; store.set('name', S.name); renderMe(); setPhase(S.phase); return;
    case 'track': S.track = m.track; S.lines = m.lines || []; resetLyricState(); setPhase('ready'); return;
    case 'roles': m.roles.split('').forEach((r, i) => { if (S.lines[i]) S.lines[i].role = r; }); renderLyrics(); return;
    case 'started': resetLyricState(); setPhase('play'); return;
    case 'pos': S.base = { pos: m.pos, ts: m.ts, playing: m.playing }; return;
    case 'offset': S.gOffset = m.value; return;
    case 'results': S.players = m.players; setPhase('results'); return;
    case 'lobby': S.track = null; S.lines = []; setPhase('lobby'); return;
    case 'closed': toast('Der Raum wurde geschlossen.', 5000); return leaveLocal();
    case 'error':
      toast(m.msg, 5000);
      if (m.fatal) leaveLocal();
      return;
  }
}
function enter(m) {
  S.code = m.code; S.id = m.id; Net.saveSession(m.code, m.id);
  const s = m.snap;
  S.players = s.players; S.track = s.track; S.lines = s.lines || []; S.gOffset = s.offset || 0;
  if (s.pos) S.base = { pos: s.pos.pos, ts: s.pos.ts, playing: s.pos.playing };
  syncMe();
  $('roomInfo').textContent = 'Raum ' + S.code;
  show('main'); resetLyricState(); setPhase(s.phase);
  wake(); autoMic();
}
function syncMe() {
  const me = S.players.find(p => p.id === S.id);
  if (me) { const ch = S.role !== me.role; S.role = me.role; S.name = me.name; if (ch && S.phase) { renderMe(); setPhase(S.phase); return; } }
  renderMe();
}
function leaveLocal() {
  Net.clearSession(); Net.close(); micStop(true);
  closeSheet();
  S.code = null; S.id = null; show('join'); $('btnJoin').disabled = false;
}

/* ====================================================================
   Beitreten
   ==================================================================== */
$('btnJoin').onclick = () => {
  const code = (joinCode || $('joinCode').value).trim().toUpperCase();
  const name = $('joinName').value.trim();
  if (code.length !== 4) return toast('Bitte 4-stelligen Raum-Code eingeben');
  if (!name) return toast('Bitte Namen eingeben');
  S.name = name; store.set('name', name);
  $('btnJoin').disabled = true; setTimeout(() => { $('btnJoin').disabled = false; }, 4000);
  Net.send({ type: 'join', code, name });
};
$('btnRename').onclick = () => {
  const n = prompt('Dein Name', S.name); if (!n || !n.trim()) return;
  S.name = n.trim().slice(0, 20); store.set('name', S.name); Net.send({ type: 'profile', name: S.name }); renderMe();
};
$('btnLeave').onclick = () => { if (confirm('Raum verlassen?')) { Net.send({ type: 'leave' }); leaveLocal(); } };

/* ====================================================================
   Einstellungen aufklappen
   ==================================================================== */
function openSheet() { $('sheet').classList.remove('hidden'); }
function closeSheet() { $('sheet').classList.add('hidden'); }
$('btnGear').onclick = openSheet;
$('btnSheetClose').onclick = closeSheet;
$('sheetBack').onclick = closeSheet;

/* ====================================================================
   Anzeige
   ==================================================================== */
const ROLE_LABEL = { m: 'Mann', f: 'Frau', b: 'beide' };
function renderMe() {
  $('myNameH').textContent = S.name || '';
  const txt = S.role === 'm' ? 'Du singst: Mann' : S.role === 'f' ? 'Du singst: Frau' : 'noch nicht zugeordnet';
  $('roleBadge').className = 'badge ' + (S.role || ''); $('roleBadge').textContent = txt;
  const mini = $('roleMini'); mini.className = S.role || ''; mini.textContent = S.role === 'm' ? 'Mann' : S.role === 'f' ? 'Frau' : 'Zuschauer';
  if (S.phase === 'lobby') renderHeader();
}
function renderHeader() {
  const t = S.track;
  $('barTitle').textContent = t ? t.name : 'Raum ' + (S.code || '');
  $('barSub').textContent = t ? t.artist : (S.role ? (S.role === 'm' ? 'Du singst: Mann' : 'Du singst: Frau') : 'Noch nicht zugeordnet');
}
function setPhase(p) {
  S.phase = p;
  const lyricsOn = (p === 'ready' || p === 'play');
  $('lyrScroll').classList.toggle('hidden', !(lyricsOn && S.lines.length));
  $('results').classList.toggle('hidden', p !== 'results');
  const msg = $('msg');
  msg.classList.toggle('hidden', !(p === 'lobby' || (lyricsOn && !S.lines.length)));
  if (p === 'lobby') msg.innerHTML = S.role ? 'Warte, bis der Host einen Song startet …' : 'Warte auf die Zuordnung durch den Host …<small>Aktiviere unten schon dein Mikro.</small>';
  if (lyricsOn && !S.lines.length) msg.innerHTML = 'Für diesen Song gibt es keinen Text.<small>Die Tonhöhe wird trotzdem gewertet.</small>';
  renderHeader(); renderBoard(); renderLyrics();
  if (p === 'results') renderResults();
  setTint('x');
}
function renderBoard() {
  const list = S.players.filter(p => p.role);
  const b = $('board');
  b.classList.toggle('hidden', !list.length || S.phase === 'lobby' || S.phase === 'results');
  b.innerHTML = list.map(p => `<span class="chip r-${p.role} ${p.id === S.id ? 'me' : ''}">${esc(p.name)} <b>${p.round}</b></span>`).join('');
}
function renderResults() {
  const list = S.players.filter(p => p.role).sort((a, b) => b.round - a.round);
  $('results').innerHTML = '<h2>🏆 Ergebnis</h2>' + (list.length
    ? list.map((p, i) => `<div class="res r-${p.role} ${i === 0 ? 'first' : ''} ${p.id === S.id ? 'me' : ''}"><span>${i === 0 ? '🥇 ' : ''}${esc(p.name)}<small>Gesamt ${p.total}</small></span><b>${p.round}</b></div>`).join('')
    : '<div class="hint">Keine Sänger zugeordnet.</div>');
}
function setTint(r) { $('app').style.backgroundColor = TINT[r] || TINT.x; }

/* ---- Liedtext im Spotify-Stil ---- */
const lyrScroll = $('lyrScroll'), lyrList = $('lyrList');
['touchstart', 'wheel', 'pointerdown'].forEach(ev => lyrScroll.addEventListener(ev, () => { S.userScrollUntil = Date.now() + 4000; }, { passive: true }));
function resetLyricState() { S.lastRaw = -2; S.lastActive = -2; S.userScrollUntil = 0; }
function mine(l) { return !!S.role && (l.role === 'b' || l.role === S.role); }
function lineClass(i, raw, active) {
  const l = S.lines[i];
  let c = 'ly r-' + l.role + (mine(l) ? ' mine' : '');
  if (i === active) c += ' active'; else if (i < raw || (i === raw && active !== raw)) c += ' past';
  return c;
}
function renderLyrics() {
  lyrList.innerHTML = '';
  S.lines.forEach((l, i) => {
    const d = document.createElement('div'); d.className = lineClass(i, -1, -1);
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = ROLE_LABEL[l.role] + (mine(l) ? ' · du' : '');
    d.append(tag, document.createTextNode(l.text)); lyrList.appendChild(d);
  });
  S.lastRaw = -2; S.lastActive = -2;
  $('lyrScroll').classList.toggle('hidden', !((S.phase === 'ready' || S.phase === 'play') && S.lines.length));
  $('msg').classList.toggle('hidden', !(S.phase === 'lobby' || ((S.phase === 'ready' || S.phase === 'play') && !S.lines.length)));
  if (S.phase === 'ready' || S.phase === 'play') updateLyrics(true);
}
function curPos() {
  const b = S.base; let p = b.pos;
  if (b.playing) p += (Net.serverNow() - b.ts) / 1000;
  return p - S.gOffset;
}
function findIdx(p) {
  const L = S.lines; let lo = 0, hi = L.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (L[mid].t <= p) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function scrollToLine(i, smooth) {
  if (Date.now() < S.userScrollUntil) return;
  const el = lyrList.children[i]; if (!el) return;
  const top = Math.max(0, el.offsetTop - lyrScroll.clientHeight / 2 + el.clientHeight / 2);
  if (lyrScroll.scrollTo) lyrScroll.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' }); else lyrScroll.scrollTop = top;
}
function updateLyrics(force) {
  if (S.phase !== 'play' && S.phase !== 'ready') return;
  const L = S.lines; if (!L.length) return;
  const cur = S.phase === 'play' ? curPos() : -1;
  const raw = S.phase === 'play' ? findIdx(cur) : -1;
  const active = (raw >= 0 && cur - L[raw].t <= 12) ? raw : -1;
  if (force || raw !== S.lastRaw || active !== S.lastActive) {
    S.lastRaw = raw; S.lastActive = active;
    for (let i = 0; i < L.length; i++) { const el = lyrList.children[i]; if (el) el.className = lineClass(i, raw, active); }
    if (active >= 0) { scrollToLine(active, true); setTint(L[active].role); } else { if (raw >= 0) scrollToLine(Math.min(raw + 1, L.length - 1), true); setTint('x'); }
  }
  if (active >= 0) {
    const el = lyrList.children[active];
    const next = L[active + 1] ? L[active + 1].t : L[active].t + 6;
    const dur = Math.max(1, Math.min(8, next - L[active].t - 0.3));
    if (el) el.style.setProperty('--p', Math.max(0, Math.min(100, (cur - L[active].t) / dur * 100)).toFixed(1));
  }
}

/* ====================================================================
   Mikrofon + Tonhöhe
   ==================================================================== */
const Mic = {
  stream: null, ctx: null, analyser: null, buf: null, on: false, timer: null, flushTimer: null,
  deviceId: store.get('micId', ''), sens: store.get('sens', 2.5), fixed: store.get('micFixed', null), calib: null,
  level: 0, singing: false, smooth: Pitch.makeSmoother(3), out: [], autoBase: 0.004, buckets: [], bSum: 0, bN: 0, bT: 0, last: 0,
  lastM: null
};
function showMicUi() {
  $('btnMicBanner').classList.toggle('hidden', Mic.on);
  $('micOn').classList.toggle('hidden', !Mic.on);
}
async function micStart() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('micState').textContent = 'Mikro braucht eine https-Verbindung.'; toast('Mikro braucht eine https-Verbindung.'); return false; }
  try {
    if (Mic.stream) Mic.stream.getTracks().forEach(t => t.stop());
    const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (Mic.deviceId) audio.deviceId = { exact: Mic.deviceId };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
    catch (e) {
      if (Mic.deviceId && e.name === 'OverconstrainedError') { Mic.deviceId = ''; delete audio.deviceId; stream = await navigator.mediaDevices.getUserMedia({ audio }); }
      else throw e;
    }
    Mic.stream = stream;
    if (!Mic.ctx) Mic.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await Mic.ctx.resume();
    const src = Mic.ctx.createMediaStreamSource(stream);
    Mic.analyser = Mic.ctx.createAnalyser(); Mic.analyser.fftSize = 2048; Mic.buf = new Float32Array(2048);
    src.connect(Mic.analyser);
    Mic.on = true; Mic.last = performance.now();
    clearInterval(Mic.timer); Mic.timer = setInterval(micTick, 40);
    clearInterval(Mic.flushTimer); Mic.flushTimer = setInterval(micFlush, 120);
    const tr = stream.getAudioTracks()[0];
    $('micState').textContent = 'Mikro läuft: ' + (tr.label || 'Standard');
    $('btnMic').textContent = '🎙️ Mikro neu starten';
    store.set('micWanted', true);
    showMicUi();
    Net.send({ type: 'profile', mic: true });
    await listMics(tr.getSettings().deviceId);
    return true;
  } catch (e) {
    const msg = e.name === 'NotAllowedError' ? 'Zugriff verweigert (in den Browser-Einstellungen erlauben)' : (e.message || e.name);
    $('micState').textContent = 'Mikro nicht verfügbar: ' + msg;
    toast('Mikro nicht verfügbar: ' + msg, 5000);
    Mic.on = false; showMicUi();
    Net.send({ type: 'profile', mic: false });
    return false;
  }
}
function micStop(silent) {
  clearInterval(Mic.timer); clearInterval(Mic.flushTimer);
  if (Mic.stream) Mic.stream.getTracks().forEach(t => t.stop());
  Mic.stream = null; Mic.on = false; Mic.out = []; showMicUi();
  if (!silent) Net.send({ type: 'profile', mic: false });
}
async function autoMic() { if (store.get('micWanted', false) && !Mic.on) micStart(); }
async function listMics(currentId) {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    const sel = $('micSel'); sel.innerHTML = '';
    devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || ('Mikrofon ' + (i + 1)); sel.appendChild(o); });
    if (currentId && devs.some(d => d.deviceId === currentId)) sel.value = currentId;
  } catch {}
}
$('btnMic').onclick = micStart;
$('btnMicBanner').onclick = micStart;
$('micSel').onchange = () => { Mic.deviceId = $('micSel').value; store.set('micId', Mic.deviceId); micStart(); };
$('sens').value = Mic.sens; $('sensVal').textContent = '×' + Mic.sens.toFixed(1);
$('sens').oninput = () => { Mic.sens = +$('sens').value; store.set('sens', Mic.sens); $('sensVal').textContent = '×' + Mic.sens.toFixed(1); };
$('btnCalib').onclick = () => {
  if (!Mic.on) return toast('Erst Mikro aktivieren');
  Mic.calib = { sum: 0, n: 0, until: performance.now() + 2500 }; toast('Jetzt 2,5 s nicht singen …', 2600);
};
$('btnCalibAuto').onclick = () => { Mic.fixed = null; store.set('micFixed', null); toast('Automatische Schwelle'); };

/** wird alle 40 ms aufgerufen: Pegel messen, Gesang erkennen, Tonhöhe bestimmen */
function micTick() {
  if (!Mic.on || !Mic.analyser) return;
  const now = performance.now(), dt = Math.min(0.2, (now - Mic.last) / 1000); Mic.last = now;
  Mic.analyser.getFloatTimeDomainData(Mic.buf);
  let s = 0; for (let i = 0; i < Mic.buf.length; i++) s += Mic.buf[i] * Mic.buf[i];
  const rms = Math.sqrt(s / Mic.buf.length);
  Mic.level = Mic.level * 0.5 + rms * 0.5;

  // Grundpegel (leiseste 30 % der letzten 30 s) = Raum + Box ohne Gesang
  Mic.bSum += Mic.level; Mic.bN++; Mic.bT += dt;
  if (Mic.bT >= 0.5) {
    Mic.buckets.push(Mic.bSum / Mic.bN); if (Mic.buckets.length > 60) Mic.buckets.shift();
    const sorted = [...Mic.buckets].sort((a, b) => a - b);
    Mic.autoBase = Math.max(0.002, sorted[Math.floor(sorted.length * 0.3)]);
    Mic.bSum = 0; Mic.bN = 0; Mic.bT = 0;
  }
  if (Mic.calib) {
    Mic.calib.sum += Mic.level; Mic.calib.n++;
    if (now > Mic.calib.until) { Mic.fixed = Math.max(0.002, Mic.calib.sum / Mic.calib.n); store.set('micFixed', Mic.fixed); Mic.calib = null; toast('Kalibriert'); }
  }
  const base = Mic.fixed ?? Mic.autoBase;
  Mic.singing = Mic.level > Math.max(base * Mic.sens, 0.012);

  let m = null;
  if (Mic.singing) {
    const r = Pitch.yin(Mic.buf, Mic.ctx.sampleRate);
    if (r && r.prob > 0.55) m = Mic.smooth(Pitch.hzToMidi(r.f)); else Mic.smooth(null);
  } else Mic.smooth(null);
  Mic.lastM = m;
  Mic.out.push([Net.serverNow(), m, Math.round(Mic.level * 1000) / 1000]);
  if (Mic.out.length > 100) Mic.out.splice(0, Mic.out.length - 100);
  renderPitch(m);
}
function micFlush() {
  if (!Mic.out.length) return;
  const s = Mic.out; Mic.out = [];
  Net.send({ type: 'pitch', s });
}
function renderPitch(m) {
  $('meterFill').style.width = Math.min(100, Mic.level * 600) + '%';
  $('micDot').classList.toggle('on', Mic.singing);
  const note = $('note'), sNote = $('sNote');
  if (m == null) {
    note.textContent = Mic.singing ? '…' : '–'; note.className = 'off'; sNote.textContent = note.textContent;
    $('tunerPt').style.left = '50%'; $('centTxt').textContent = Mic.singing ? 'Ton wird gesucht' : 'Deine Tonhöhe'; return;
  }
  const r = Math.round(m), cents = Math.round((m - r) * 100);
  note.textContent = Pitch.midiName(m); note.className = ''; sNote.textContent = note.textContent;
  $('tunerPt').style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
  $('centTxt').textContent = (cents >= 0 ? '+' : '') + cents + ' Cent';
}

/* ====================================================================
   Sonstiges
   ==================================================================== */
let wl = null;
async function wake() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.code) { wake(); if (store.get('micWanted', false) && !Mic.on) micStart(); } });
setInterval(() => updateLyrics(false), 100);

(function init() {
  const sess = Net.init({
    sessKey: 'ka_dev', storage: localStorage, onMessage: handle,
    onState: ok => $('conn').classList.toggle('hidden', ok || !S.code)
  });
  const qs = new URLSearchParams(location.search);
  const room = (qs.get('room') || '').toUpperCase();
  if (room.length === 4) {
    // Link aus dem QR-Code: Code übernehmen (und alte Sitzung eines anderen Raums verwerfen)
    if (sess && sess.code !== room) { Net.clearSession(); }
    joinCode = room;
    $('codeRow').classList.add('hidden'); $('roomLabel').classList.remove('hidden'); $('roomLabel').innerHTML = 'Raum <b>' + esc(room) + '</b>';
    history.replaceState({}, '', '/phone.html');
  }
  $('joinName').value = S.name || '';
  showMicUi();
  if (Net.code && Net.id) { S.code = Net.code; S.id = Net.id; Net.connect(); }
})();
</script>
